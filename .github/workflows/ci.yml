name: CI

on:
  push:
    branches: [main, 'fix/**', 'feature/**', 'test/**']
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  deno-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test edge functions
        run: |
          deno test --allow-env supabase/functions/ncba-payment-webhook/index.test.ts
          deno test --allow-env supabase/functions/gemma-triage/index.test.ts
          deno test --allow-env supabase/functions/gemma-session-notes/index.test.ts
